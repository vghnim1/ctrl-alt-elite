<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to set Inter font and ensure full viewport height */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        /* Custom styles for button focus effect */
        .register-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.5); /* Use a green focus color for registration */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Registration Container Card -->
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl transition-all duration-300 hover:shadow-3xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h1>
        <p class="text-center text-gray-500 mb-8">Join the authenticated machine!</p>

        <!-- Registration Form Fields -->
        <div id="registrationForm" class="space-y-6">
            <div>
                <label for="regUsername" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    type="text" 
                    id="regUsername" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
                    placeholder="Choose a username"
                >
            </div>
            <div>
                <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    id="regPassword" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
                    placeholder="••••••••"
                >
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
                    placeholder="••••••••"
                >
            </div>

            <!-- Registration Button -->
            <button 
                id="registerButton" 
                onclick="attemptRegistration()" 
                class="register-btn w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition duration-200 shadow-md hover:shadow-lg"
            >
                Register Account
            </button>
        </div>

        <!-- Response and Status Area -->
        <div id="textResponse" class="mt-8 p-4 text-sm text-center bg-gray-100 rounded-lg border border-gray-200 transition duration-300">
            Ready to register...
        </div>
        
        <!-- Link back to Login Page -->
        <p class="mt-6 text-center text-sm text-gray-500">
            Already have an account? 
            <a href="index.html" class="font-medium text-blue-600 hover:text-blue-500 transition duration-150">
                Log In here
            </a>
        </p>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. Response Handler ---
        function HandleRegistrationResponse(response) {
            const responseElement = document.getElementById("textResponse");
            try {
                // Attempt to parse the response as JSON
                var text = JSON.parse(response);
                responseElement.innerHTML = `<span class="font-semibold text-green-600">Success!</span> Account created: ${JSON.stringify(text)}`;
                responseElement.classList.remove('bg-gray-100', 'bg-red-100');
                responseElement.classList.add('bg-green-100');
            } catch (e) {
                // If parsing fails, display the raw text and an error indicator
                responseElement.innerHTML = `<span class="font-semibold text-red-600">Error!</span> Raw Response: ${response}`;
                responseElement.classList.remove('bg-gray-100', 'bg-green-100');
                responseElement.classList.add('bg-red-100');
            }
        }

        // --- 2. Request Sender ---
        function SendRegistrationRequest(username, password) {
            const responseElement = document.getElementById("textResponse");
            const registerButton = document.getElementById("registerButton");

            // Disable button and update status while requesting
            registerButton.disabled = true;
            registerButton.classList.add('opacity-50', 'cursor-not-allowed');
            registerButton.innerHTML = 'Registering...';
            responseElement.innerHTML = 'Sending registration request...';
            responseElement.classList.remove('bg-red-100', 'bg-green-100');
            responseElement.classList.add('bg-yellow-100');


            var request = new XMLHttpRequest();
            // Note: Use 'register.php' as the endpoint for registration
            request.open("POST", "register.php", true); 
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            
            request.onreadystatechange = function () {
                if (this.readyState == 4) {
                    // Re-enable button regardless of success/failure
                    registerButton.disabled = false;
                    registerButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    registerButton.innerHTML = 'Register Account';
                    responseElement.classList.remove('bg-yellow-100');

                    if (this.status == 200) {
                        HandleRegistrationResponse(this.responseText);
                    } else {
                        // Handle server-side errors (404, 500, etc.)
                        const errorMsg = `HTTP Error: ${this.status} (${this.statusText}). Check if 'register.php' is running.`;
                        responseElement.innerHTML = `<span class="font-semibold text-red-600">Failed!</span> ${errorMsg}`;
                        responseElement.classList.add('bg-red-100');
                    }
                }
            }
            // Send username and password data, including the registration type
            request.send(`type=register&uname=${encodeURIComponent(username)}&pword=${encodeURIComponent(password)}`);
        }

        // --- 3. UI Interaction Function ---
        function attemptRegistration() {
            const usernameInput = document.getElementById("regUsername").value.trim();
            const passwordInput = document.getElementById("regPassword").value;
            const confirmInput = document.getElementById("confirmPassword").value;
            const responseElement = document.getElementById("textResponse");

            if (!usernameInput || !passwordInput || !confirmInput) {
                responseElement.innerHTML = '<span class="font-semibold text-red-600">Validation Error:</span> Please fill in all fields.';
                responseElement.classList.remove('bg-gray-100', 'bg-green-100');
                responseElement.classList.add('bg-red-100');
                return;
            }

            if (passwordInput !== confirmInput) {
                responseElement.innerHTML = '<span class="font-semibold text-red-600">Validation Error:</span> Passwords do not match.';
                responseElement.classList.remove('bg-gray-100', 'bg-green-100');
                responseElement.classList.add('bg-red-100');
                return;
            }

            // Call the request sender with the user input
            SendRegistrationRequest(usernameInput, passwordInput);
        }
    </script>

</body>
</html>
