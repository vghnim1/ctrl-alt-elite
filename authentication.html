<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticated Machine</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; /* Slightly darker gray for the main app area */
        }
        /* Style for the logout button focus effect */
        .logout-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); /* Red focus color */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Authenticated App Container -->
    <div class="w-full max-w-2xl bg-white p-10 rounded-xl shadow-2xl transition-all duration-300">
        
        <h1 class="text-4xl font-extrabold text-center text-green-700 mb-4">
            ACCESS GRANTED
        </h1>
        <p class="text-center text-xl text-gray-600 mb-8">
            Welcome to the Authenticated Machine. You are authorized!
        </p>

        <!-- Main Content Area (A simple "dashboard" placeholder) -->
        <div class="bg-indigo-50 p-6 rounded-lg border border-indigo-200 space-y-4">
            <h2 class="text-2xl font-semibold text-indigo-700">Dashboard Status</h2>
            <p class="text-gray-700">
                This area shows content only authenticated users should see.
                <br>Your temporary user session ID is: <span class="font-mono bg-indigo-200 text-indigo-800 p-1 rounded text-sm">guest_session_921</span>
            </p>
            
            <ul class="list-disc list-inside text-gray-600 pl-4">
                <li>Secret Feature 1: Running</li>
                <li>Secret Feature 2: Running</li>
                <li>System Time: <span id="currentTime" class="font-medium text-indigo-600">Loading...</span></li>
            </ul>
        </div>
        
        <!-- Logout Button -->
        <div class="mt-8 text-center">
            <button 
                id="logoutButton" 
                onclick="logout()" 
                class="logout-btn bg-red-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-red-700 transition duration-200 shadow-lg"
            >
                Log Out
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Simple function to update the time placeholder (adds a bit of basic interactivity)
        function updateTime() {
            const timeElement = document.getElementById('currentTime');
            if (timeElement) {
                timeElement.textContent = new Date().toLocaleTimeString();
            }
        }
        setInterval(updateTime, 1000);
        updateTime(); // Initial call

        // --- Logout Logic ---
        function logout() {
            // For a student project, simply redirecting is fine.
            document.getElementById('logoutButton').innerHTML = 'Logging out...';
            // Use a short delay to simulate the action before redirecting
            setTimeout(() => {
                // Redirect back to the login page (index.html)
                window.location.href = "index.html";
            }, 500); 
        }
    </script>
</body>
</html>
