<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticated Machine</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; /* Slightly darker gray for the main app area */
        }
        /* Style for the logout button focus effect */
        .logout-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); /* Red focus color */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Authenticated App Container -->
    <div class="w-full max-w-2xl bg-white p-10 rounded-xl shadow-2xl transition-all duration-300">
        
        <h1 class="text-4xl font-extrabold text-center text-green-700 mb-4">
            ACCESS GRANTED
        </h1>
        <p class="text-center text-xl text-gray-600 mb-8">
            Welcome to the Authenticated Machine. You are authorized!
        </p>
        
        <!-- Logout Button -->
        <div class="mt-8 text-center">
            <button 
                id="logoutButton" 
                onclick="logout()" 
                class="logout-btn bg-red-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-red-700 transition duration-200 shadow-lg"
            >
                Log Out
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Session Storage Logic (Internal) ---
        function checkAuthStatus() {
            // Check if an existing ID is available or set a new one.
            let sessionId = sessionStorage.getItem('userSessionId');

            if (!sessionId) {
                // If no ID exists, simulate a fresh login and set a new, random ID.
                sessionId = 'user_' + Math.random().toString(16).slice(2);
                sessionStorage.setItem('userSessionId', sessionId);
                console.log("New session started and stored in SessionStorage.");
            } else {
                // If ID exists, the user is authorized.
                console.log("Authenticated session retrieved from storage.");
            }

            // The ID is still tracked internally for the session, but not displayed.
            console.log("Current Session ID:", sessionStorage.getItem('userSessionId'));
        }

        // --- Logout Logic ---
        function logout() {
            document.getElementById('logoutButton').innerHTML = 'Logging out...';
            
            // Clear the session ID from session storage
            sessionStorage.removeItem('userSessionId');
            console.log("Session ID cleared from SessionStorage.");

            // Use a short delay to simulate the action before redirecting
            setTimeout(() => {
                // Redirect back to the login page (index.html)
                window.location.href = "index.html";
            }, 500); 
        }

        // Run the authentication check when the page loads
        checkAuthStatus();
    </script>

</body>
</html>
