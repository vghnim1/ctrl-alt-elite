<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the Register button focus effect */
        .register-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.5); /* Green focus color */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-100">

    <!-- Registration Form Container -->
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl transition-all duration-300">
        
        <h1 class="text-3xl font-bold text-center text-green-600 mb-6">
            New Account Registration
        </h1>

        <form id="registrationForm" onsubmit="return validateForm()" class="space-y-4">
            <!-- First Name -->
            <input 
                type="text" 
                id="firstName" 
                placeholder="First Name" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >

            <!-- Last Name -->
            <input 
                type="text" 
                id="lastName" 
                placeholder="Last Name" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >

            <!-- Email Address -->
            <input 
                type="email" 
                id="email" 
                placeholder="Email Address" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >
            
            <!-- Username -->
            <input 
                type="text" 
                id="username" 
                placeholder="Username" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >

            <!-- Password -->
            <input 
                type="password" 
                id="password" 
                placeholder="Password" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >

            <!-- Confirm Password -->
            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirm Password" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150"
            >

            <!-- Registration Button -->
            <button 
                type="submit" 
                class="register-btn w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition duration-200 shadow-lg"
            >
                Register
            </button>
        </form>

        <!-- Response Message / Status Area -->
        <div id="textResponse" class="mt-4 p-3 text-sm text-center bg-gray-50 text-gray-700 rounded-lg border border-gray-200">
            Awaiting input...
        </div>

        <!-- Link back to Login -->
        <div class="mt-6 text-center text-sm">
            <a href="index.html" class="text-blue-500 hover:text-blue-700 font-medium transition duration-150">
                Already have an account? Go to Login
            </a>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function HandleRegistrationResponse(response) {
            // NOTE: In a real app, you would check the response status here.
            
            // Assuming a successful response from the server redirects to the authenticated page
            if (response.includes("success")) {
                document.getElementById("textResponse").textContent = "Registration successful! Redirecting...";
                document.getElementById("textResponse").classList.add("text-green-600", "bg-green-100");
                
                // Simulate redirect after a successful registration
                setTimeout(() => {
                    window.location.href = "authentication.html";
                }, 1000);
            } else {
                 document.getElementById("textResponse").textContent = "Registration failed. Please try again.";
                 document.getElementById("textResponse").classList.add("text-red-600", "bg-red-100");
            }
        }

        function SendRegistrationRequest(firstName, lastName, email, username, password) {
            var request = new XMLHttpRequest();
            // This endpoint is just a placeholder for your backend
            request.open("POST", "register.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            
            request.onreadystatechange = function () {
                if ((this.readyState == 4) && (this.status == 200)) {
                    HandleRegistrationResponse(this.responseText);
                } else if (this.readyState == 4) {
                    document.getElementById("textResponse").textContent = "Error communicating with server.";
                    document.getElementById("textResponse").classList.add("text-red-600", "bg-red-100");
                }
            }

            // Constructing the data payload with all the new fields
            var data = "type=register" +
                       "&fname=" + encodeURIComponent(firstName) +
                       "&lname=" + encodeURIComponent(lastName) +
                       "&email=" + encodeURIComponent(email) +
                       "&uname=" + encodeURIComponent(username) +
                       "&pword=" + encodeURIComponent(password);
                       
            request.send(data);
        }

        function validateForm() {
            var firstName = document.getElementById("firstName").value.trim();
            var lastName = document.getElementById("lastName").value.trim();
            var email = document.getElementById("email").value.trim();
            var username = document.getElementById("username").value.trim();
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            var responseBox = document.getElementById("textResponse");

            // Reset status styles
            responseBox.classList.remove("text-red-600", "bg-red-100", "text-green-600", "bg-green-100");

            if (!firstName || !lastName || !email || !username || !password || !confirmPassword) {
                responseBox.textContent = "Error: All fields are required!";
                responseBox.classList.add("text-red-600", "bg-red-100");
                return false;
            }

            if (password !== confirmPassword) {
                responseBox.textContent = "Error: Passwords do not match!";
                responseBox.classList.add("text-red-600", "bg-red-100");
                return false;
            }
            
            // If validation passes, send the request
            responseBox.textContent = "Attempting registration...";
            SendRegistrationRequest(firstName, lastName, email, username, password);
            
            // Prevent default form submission to handle it via AJAX
            return false;
        }
    </script>
</body>
</html>
