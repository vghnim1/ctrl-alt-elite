<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to set Inter font and ensure full viewport height */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        /* Custom styles for button focus effect */
        .login-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Login Container Card -->
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl transition-all duration-300 hover:shadow-3xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back</h1>
        <p class="text-center text-gray-500 mb-8">Sign in to access the authenticated machine.</p>

        <!-- Form Fields -->
        <div id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                    placeholder="Enter your username"
                >
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                    placeholder="••••••••"
                >
            </div>

            <!-- Login Button -->
            <button 
                id="loginButton" 
                onclick="attemptLogin()" 
                class="login-btn w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md hover:shadow-lg"
            >
                Log In
            </button>
        </div>

        <!-- Response and Status Area -->
        <div id="textResponse" class="mt-8 p-4 text-sm text-center bg-gray-100 rounded-lg border border-gray-200 transition duration-300">
            Awaiting user input...
        </div>
        
        <!-- Placeholder for Registration Link -->
        <p class="mt-6 text-center text-sm text-gray-500">
            Don't have an account? 
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition duration-150">
                Register here
            </a>
        </p>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. Response Handler ---
        function HandleLoginResponse(response) {
            const responseElement = document.getElementById("textResponse");
            try {
                // Attempt to parse the response as JSON
                var text = JSON.parse(response);
                responseElement.innerHTML = `<span class="font-semibold text-green-600">Success!</span> Response: ${JSON.stringify(text)}`;
                responseElement.classList.remove('bg-gray-100');
                responseElement.classList.add('bg-green-100');
            } catch (e) {
                // If parsing fails, display the raw text and an error indicator
                responseElement.innerHTML = `<span class="font-semibold text-red-600">Error!</span> Raw Response: ${response}`;
                responseElement.classList.remove('bg-gray-100');
                responseElement.classList.add('bg-red-100');
            }
        }

        // --- 2. Request Sender ---
        function SendLoginRequest(username, password) {
            const responseElement = document.getElementById("textResponse");
            const loginButton = document.getElementById("loginButton");

            // Disable button and update status while requesting
            loginButton.disabled = true;
            loginButton.classList.add('opacity-50', 'cursor-not-allowed');
            loginButton.innerHTML = 'Logging in...';
            responseElement.innerHTML = 'Sending login request...';
            responseElement.classList.remove('bg-red-100', 'bg-green-100');
            responseElement.classList.add('bg-yellow-100');


            var request = new XMLHttpRequest();
            // Note: Since 'login.php' is a dummy endpoint, this request will likely fail (404/CORS) 
            // but the logic here is preserved as requested.
            request.open("POST", "login.php", true); 
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            
            request.onreadystatechange = function () {
                if (this.readyState == 4) {
                    // Re-enable button regardless of success/failure
                    loginButton.disabled = false;
                    loginButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    loginButton.innerHTML = 'Log In';
                    responseElement.classList.remove('bg-yellow-100');

                    if (this.status == 200) {
                        HandleLoginResponse(this.responseText);
                    } else {
                        // Handle server-side errors (404, 500, etc.)
                        const errorMsg = `HTTP Error: ${this.status} (${this.statusText}). Check if 'login.php' is running.`;
                        responseElement.innerHTML = `<span class="font-semibold text-red-600">Failed!</span> ${errorMsg}`;
                        responseElement.classList.add('bg-red-100');
                    }
                }
            }
            // Send username and password data
            request.send(`type=login&uname=${encodeURIComponent(username)}&pword=${encodeURIComponent(password)}`);
        }

        // --- 3. UI Interaction Function ---
        function attemptLogin() {
            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;
            const responseElement = document.getElementById("textResponse");

            if (!usernameInput || !passwordInput) {
                responseElement.innerHTML = '<span class="font-semibold text-red-600">Validation Error:</span> Please enter both username and password.';
                responseElement.classList.remove('bg-gray-100', 'bg-green-100');
                responseElement.classList.add('bg-red-100');
                return;
            }

            // Call the request sender with the user input
            SendLoginRequest(usernameInput, passwordInput);
        }

        // Removed the initial immediate call to SendLoginRequest. 
        // The request now runs only when the user clicks the "Log In" button.
    </script>

</body>
</html>
